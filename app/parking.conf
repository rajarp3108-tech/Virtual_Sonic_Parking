# parking.conf - configuration for the parking monitor (FR-14)
#
# Format: one "key = value" per line. Everything after '#' is a comment.
# Blank lines are ignored. Unknown keys are reported and skipped, so a typo
# never stops the program.
#
# Command line flags (--device, --port, ...) override the values in this file.

# --- device ---------------------------------------------------------------
# Character device created by the kernel module.
device_path = /dev/parking_sensor

# --- monitoring ------------------------------------------------------------
# How often the device is polled, in milliseconds.
poll_interval_ms = 1000

# --- state machine thresholds (centimetres) -------------------------------
# distance > warning  -> SAFE
# distance <= danger  -> DANGER
# otherwise          -> WARNING
warning_threshold_cm = 50
danger_threshold_cm  = 20

# --- logging ---------------------------------------------------------------
log_path = logs/parking.log

# --- TCP status server -----------------------------------------------------
tcp_enabled = true
bind_address = 127.0.0.1
tcp_port = 9000
